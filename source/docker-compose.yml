services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PHOTON_URL=http://photon:2322/api
      - GEOCODING_DELAY_SECONDS=0
    volumes:
      - ./backend:/app
      - ./backend/cache:/app/cache
      - ./feste.config:/feste.config:ro
      - ./planner.config:/planner.config:ro

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  photon:
    image: rtuszik/photon-docker:latest
    platform: linux/amd64
    profiles:
      - photon
    env_file:
      - .env
    environment:
      - IMPORT_MODE=jsonl
      - REGION=italy
      - BASE_URL=https://download1.graphhopper.com/public
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:-}
    ports:
      - "2322:2322"
    volumes:
      - photon_data:/photon/data
    restart: unless-stopped

volumes:
  photon_data:
